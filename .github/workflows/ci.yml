# MultiDisplay Unified — build & test CI (Linux / Windows / macOS)
#
# - linux: authoritative job. apt Qt6; Ubuntu 24.04 ships no Qt6 Qwt package,
#   so Qwt 6.3 is pinned and built from source against the runner's Qt6.
# - windows / macos: ecosystem-standard setup — Qt 6.8 LTS via aqtinstall
#   (AnotherQtInstaller, pip), MSVC (vcvars + nmake) on Windows, clang/make on
#   macOS; Qwt 6.3 is likewise built from source against the pinned Qt.
#   These jobs exist so beta testers on those platforms get self-contained
#   build artifacts (zip / dmg); they are community-iterated, not owner-maintained.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  QWT_VERSION: "6.3.0"
  QT_VERSION: "6.8.2"

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6 + tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev-tools qt6-base-dev qt6-serialport-dev qt6-svg-dev \
            libgl1-mesa-dev ninja-build wget tar xz-utils \
            libegl1 libgl1 libglib2.0-0t64 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Build Qwt ${{ env.QWT_VERSION }} from source (Qt6)
        run: |
          set -euo pipefail
          wget -q "https://downloads.sourceforge.net/project/qwt/qwt/${{ env.QWT_VERSION }}/qwt-${{ env.QWT_VERSION }}.tar.bz2" -O /tmp/qwt.tar.bz2
          tar xf /tmp/qwt.tar.bz2 -C /tmp
          cd "/tmp/qwt-${{ env.QWT_VERSION }}"
          sed -i "s#^ *QWT_INSTALL_PREFIX.*#QWT_INSTALL_PREFIX    = /opt/qwt#" qwtconfig.pri
          qmake6 src/src.pro
          make -j"$(nproc)"
          sudo make install
          sudo ldconfig

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DQWT_PREFIX=/opt/qwt

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Unit tests
        working-directory: build
        run: ctest --output-on-failure

      - name: Package (tar.gz of the built binary)
        run: tar czf mdu-linux-x64.tar.gz -C build multidisplay-unified

      - uses: actions/upload-artifact@v4
        with:
          name: mdu-linux-x64
          path: mdu-linux-x64.tar.gz

  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt ${{ env.QT_VERSION }} (aqtinstall)
        shell: pwsh
        run: |
          python -m pip install --upgrade aqtinstall
          python -m aqt install-qt windows desktop ${{ env.QT_VERSION }} win64_msvc2022_64 -O "$env:RUNNER_TEMP\qt"
          $qt = "$env:RUNNER_TEMP\qt\${{ env.QT_VERSION }}\msvc2022_64"
          "QTDIR=$qt" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$qt\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build Qwt ${{ env.QWT_VERSION }} from source (MSVC)
        shell: cmd
        run: |
          curl -L -sSf -o "%RUNNER_TEMP%\qwt.tar.bz2" "https://downloads.sourceforge.net/project/qwt/qwt/${{ env.QWT_VERSION }}/qwt-${{ env.QWT_VERSION }}.tar.bz2"
          tar -xjf "%RUNNER_TEMP%\qwt.tar.bz2" -C "%RUNNER_TEMP%"
          cd "%RUNNER_TEMP%\qwt-${{ env.QWT_VERSION }}"
          powershell -Command "(gc qwtconfig.pri) -replace '(?m)^ *QWT_INSTALL_PREFIX.*=.*','QWT_INSTALL_PREFIX    = $env:GITHUB_WORKSPACE/qwt-install' | Set-Content qwtconfig.pri"
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          qmake src\src.pro
          nmake /NOLOGO
          nmake /NOLOGO install

      - name: Configure
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DQWT_PREFIX=%GITHUB_WORKSPACE%\qwt-install

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake --build build

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Package (windeployqt + zip)
        shell: cmd
        run: |
          windeployqt --release --no-translations build\multidisplay-unified.exe
          copy /y "%GITHUB_WORKSPACE%\qwt-install\lib\*.dll" build\ >nul
          dir /b build\*.exe build\*.dll
          powershell -Command "Compress-Archive -Path build\* -DestinationPath mdu-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: mdu-windows-x64
          path: mdu-windows-x64.zip

  macos:
    runs-on: macos-14
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt ${{ env.QT_VERSION }} (aqtinstall)
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --upgrade pip aqtinstall
          "$RUNNER_TEMP/venv/bin/aqt" install-qt mac desktop ${{ env.QT_VERSION }} clang_64 -O "$RUNNER_TEMP/qt"
          echo "$RUNNER_TEMP/qt/${{ env.QT_VERSION }}/macos/bin" >> "$GITHUB_PATH"

      - name: Build Qwt ${{ env.QWT_VERSION }} from source (Qt6)
        run: |
          set -euo pipefail
          curl -sSfL "https://downloads.sourceforge.net/project/qwt/qwt/${{ env.QWT_VERSION }}/qwt-${{ env.QWT_VERSION }}.tar.bz2" -o /tmp/qwt.tar.bz2
          tar xjf /tmp/qwt.tar.bz2 -C /tmp
          cd "/tmp/qwt-${{ env.QWT_VERSION }}"
          sed -i '' "s#^ *QWT_INSTALL_PREFIX.*#QWT_INSTALL_PREFIX    = $GITHUB_WORKSPACE/qwt-install#" qwtconfig.pri
          qmake src/src.pro
          make -j"$(sysctl -n hw.ncpu)" install

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DQWT_PREFIX="$GITHUB_WORKSPACE/qwt-install"

      - name: Build
        run: cmake --build build

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Package (macdeployqt + dmg)
        run: |
          set -euo pipefail
          APP=build/multidisplay-unified.app
          macdeployqt "$APP"
          cp -a "$GITHUB_WORKSPACE"/qwt-install/lib/*.framework "$APP/Contents/Frameworks/" 2>/dev/null || true
          cp -a "$GITHUB_WORKSPACE"/qwt-install/lib/libqwt*.dylib* "$APP/Contents/Frameworks/" 2>/dev/null || true
          install_name_tool -add_rpath @executable_path/../Frameworks "$APP/Contents/MacOS/multidisplay-unified" 2>/dev/null || true
          hdiutil create -srcfolder "$APP" -volname MDU -ov mdu-macos.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: mdu-macos
          path: mdu-macos.dmg

