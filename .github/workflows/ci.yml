# MultiDisplay Unified — build & test CI
#
# ubuntu job is authoritative (apt Qt6). Ubuntu 24.04 ships no Qt6 build of Qwt
# (only libqwt-qt5-dev), so Qwt 6.3 is pinned and built from source against the
# runner's Qt6 before configuring. A Windows matrix entry is intentionally
# absent for now — the ecosystem-standard Windows toolchain pinning is tracked
# in A-class.md (Pillar 6) and will be added once the MSVC/CIQt setup is agreed on.
name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  QWT_VERSION: "6.3.0"

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6 + tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev-tools qt6-base-dev qt6-serialport-dev qt6-svg-dev \
            libgl1-mesa-dev ninja-build wget tar xz-utils \
            libegl1 libgl1 libglib2.0-0t64 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Build Qwt ${{ env.QWT_VERSION }} from source (Qt6)
        run: |
          set -euo pipefail
          wget -q "https://downloads.sourceforge.net/project/qwt/qwt/${{ env.QWT_VERSION }}/qwt-${{ env.QWT_VERSION }}.tar.bz2" -O /tmp/qwt.tar.bz2
          tar xf /tmp/qwt.tar.bz2 -C /tmp
          cd "/tmp/qwt-${{ env.QWT_VERSION }}"
          qmake6 PREFIX=/usr/local
          make -j"$(nproc)"
          sudo make install
          sudo ldconfig

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Unit tests
        working-directory: build
        run: ctest --output-on-failure
