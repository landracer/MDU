# MultiDisplay Unified — build & test CI (Linux / Windows / macOS)
#
# - linux: authoritative job. apt Qt6 (no Qt6-Qwt deb in Noble; we compile the
#   vendored Qwt 6.3 sources via QWT_SRC_DIR on every platform, one method.
# - windows / macos: ecosystem-standard setup — Qt 6.8 LTS via aqtinstall
#   (AnotherQtInstaller, pip), MSVC (vcvars + Ninja) on Windows, clang on
#   macOS; Qwt 6.3 ships VENDORED in the repo (resources/plotting/qwt-6.3.0)
#   and is compiled from source by our own CMake on every platform — no runtime
#   Qt dependency for the plotting layer, no runner package hunting.
#   These jobs exist so beta testers on those platforms get self-contained
#   build artifacts (zip / dmg); they are community-iterated, not owner-maintained.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  QWT_VERSION: "6.3.0"
  QT_VERSION: "6.8.2"

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6 + tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev-tools qt6-base-dev qt6-serialport-dev qt6-svg-dev \
            libgl1-mesa-dev ninja-build wget tar xz-utils \
            libegl1 libgl1 libglib2.0-0t64 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DQWT_SRC_DIR=${{ github.workspace }}/resources/plotting/qwt-${{ env.QWT_VERSION }}

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Unit tests
        working-directory: build
        run: ctest --output-on-failure

      - name: Package (tar.gz of the built binary)
        run: tar czf mdu-linux-x64.tar.gz -C build multidisplay-unified

      - uses: actions/upload-artifact@v4
        with:
          name: mdu-linux-x64
          path: mdu-linux-x64.tar.gz

  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt ${{ env.QT_VERSION }} (aqtinstall)
        shell: pwsh
        run: |
          python -m pip install --upgrade aqtinstall
          python -m aqt install-qt windows desktop ${{ env.QT_VERSION }} win64_msvc2022_64 -m qtserialport -O "$env:RUNNER_TEMP\qt"
          $qt = "$env:RUNNER_TEMP\qt\${{ env.QT_VERSION }}\msvc2022_64"
          "QTDIR=$qt" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$qt\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Configure
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DQWT_SRC_DIR=%GITHUB_WORKSPACE%\resources\plotting\qwt-${{ env.QWT_VERSION }}

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake --build build

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Package (windeployqt + zip)
        shell: cmd
        run: |
          windeployqt --release --no-translations build\multidisplay-unified.exe
          dir /b build\*.exe build\*.dll
          powershell -Command "Compress-Archive -Path build\* -DestinationPath mdu-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: mdu-windows-x64
          path: mdu-windows-x64.zip

  macos:
    runs-on: macos-14
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt ${{ env.QT_VERSION }} (aqtinstall)
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --upgrade pip aqtinstall
          "$RUNNER_TEMP/venv/bin/aqt" install-qt mac desktop ${{ env.QT_VERSION }} clang_64 -m qtserialport -O "$RUNNER_TEMP/qt"
          echo "$RUNNER_TEMP/qt/${{ env.QT_VERSION }}/macos/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DQWT_SRC_DIR="$GITHUB_WORKSPACE/resources/plotting/qwt-${{ env.QWT_VERSION }}"

      - name: Build
        run: cmake --build build

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Package (macdeployqt + dmg)
        run: |
          set -euo pipefail
          macdeployqt build/multidisplay-unified.app
          hdiutil create -srcfolder build/multidisplay-unified.app -volname MDU -ov mdu-macos.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: mdu-macos
          path: mdu-macos.dmg

